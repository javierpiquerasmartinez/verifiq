name: E2E

# On demand, and before each release (issue 29): a real browser against staging. It issues, rectifies
# and voids invoices at the AEAT test environment, which limits its volume: never on every push.
on:
  workflow_dispatch:
  # TEMPORARY: runs the branch's first versions against staging. Removed before merging.
  push:
    branches: [feat/e2e]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: https://app.staging.verifiq.es
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_OPERATOR_EMAIL: ${{ secrets.E2E_OPERATOR_EMAIL }}
      E2E_OPERATOR_PASSWORD: ${{ secrets.E2E_OPERATOR_PASSWORD }}
      E2E_OPERATOR_TOTP_SECRET: ${{ secrets.E2E_OPERATOR_TOTP_SECRET }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_USER_TOTP_SECRET: ${{ secrets.E2E_USER_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # TEMPORARY: the shape of the TOTP secrets (never their value), to check they were copied whole.
      - name: Check the TOTP secrets' shape
        run: |
          for name in E2E_OPERATOR_TOTP_SECRET E2E_USER_TOTP_SECRET; do
            value="${!name}"; compact=$(printf '%s' "$value" | tr -d ' =' | tr 'a-z' 'A-Z')
            if printf '%s' "$compact" | grep -Eq '^[A-Z2-7]+$'; then shape=base32; else shape='NOT base32'; fi
            echo "$name: ${#value} characters, ${#compact} without spaces, $shape"
          done
      - run: pnpm --filter @verifiq/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @verifiq/e2e e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 14
