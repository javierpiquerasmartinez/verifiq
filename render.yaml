# Render Blueprint: staging (branch `stage`). Secrets are set in the Render dashboard (sync: false).
envVarGroups:
  - name: verifiq-staging
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false

services:
  - type: web
    name: verifiq-api-staging
    runtime: node
    plan: starter
    region: frankfurt
    branch: stage
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@verifiq/api
    # Runs before each deploy; a non-zero exit aborts the deploy and keeps the previous version live.
    preDeployCommand: node apps/api/dist/run-migrations.js
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - fromGroup: verifiq-staging
      - key: WEB_ORIGIN
        sync: false

  - type: worker
    name: verifiq-worker-staging
    runtime: node
    plan: starter
    region: frankfurt
    branch: stage
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@verifiq/api
    startCommand: node apps/api/dist/worker.js
    envVars:
      - fromGroup: verifiq-staging
