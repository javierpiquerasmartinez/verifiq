# Render Blueprint, synced from `stage`: staging (branch `stage`) and production (branch `main`).
# Same commands as the README deploy table. Secrets are set in the Render dashboard (sync: false),
# never in the repo; each environment has its own.
services:
  - type: web
    name: verifiq-api-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: stage
    buildCommand: pnpm install --frozen-lockfile && pnpm build:api
    # Migrates on start: if it fails, the new version never passes the health check
    # and Render keeps the previous one live. Fine with a single instance.
    startCommand: pnpm start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Render's edge (Cloudflare) names the client there; clients cannot forge it (issue 22).
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: VERIFACTI_API_KEY
        sync: false
      - key: VERIFACTI_ENVIRONMENT
        value: test
      - key: CONNECTOR_MASTER_KEY
        sync: false
      - key: VERIFACTI_WEBHOOK_SECRET
        sync: false
      - key: VERIFACTI_WEBHOOK_ID
        sync: false
      - key: OPERATOR_EMAIL
        sync: false
  # Sends the outbox to VeriFactu, draws the PDFs and polls the AEAT's verdicts. Render has no free
  # workers: 0.5c-512mb is the cheapest plan. Its secrets are the API's (fromService), so they are set
  # once, on the API; after changing one there, redeploy the worker too.
  - type: worker
    name: verifiq-worker-staging
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    branch: stage
    buildCommand: pnpm install --frozen-lockfile && pnpm build:api
    startCommand: pnpm start:worker
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: DATABASE_URL
      - key: RESEND_API_KEY
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: RESEND_API_KEY
      - key: EMAIL_FROM
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: EMAIL_FROM
      - key: R2_ACCOUNT_ID
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: R2_ACCOUNT_ID
      - key: R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: R2_SECRET_ACCESS_KEY
      - key: R2_BUCKET
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: R2_BUCKET
      - key: VERIFACTI_API_KEY
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: VERIFACTI_API_KEY
      - key: VERIFACTI_ENVIRONMENT
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: VERIFACTI_ENVIRONMENT
      - key: CONNECTOR_MASTER_KEY
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: CONNECTOR_MASTER_KEY
      - key: OPERATOR_EMAIL
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: OPERATOR_EMAIL

  # --- Production (branch `main`, released by a PR from `stage`). Paid plans: no cold starts (the results
  # webhook must answer within 10 s) and a pre-deploy step. Real invoices: VERIFACTI_ENVIRONMENT=prod.
  - type: web
    name: verifiq-api
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm build:api
    # Migrates once, before the new version starts; if it fails, the deploy stops and the previous
    # version stays live. Migrations are backward compatible (expand/contract): the running version and
    # the worker keep working while they apply.
    preDeployCommand: pnpm migrate:api
    startCommand: pnpm serve:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: VERIFACTI_ENVIRONMENT
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: VERIFACTI_API_KEY
        sync: false
      - key: CONNECTOR_MASTER_KEY
        sync: false
      - key: VERIFACTI_WEBHOOK_SECRET
        sync: false
      - key: VERIFACTI_WEBHOOK_ID
        sync: false
      - key: OPERATOR_EMAIL
        sync: false
  - type: worker
    name: verifiq-worker
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm build:api
    startCommand: pnpm start:worker
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromService:
          type: web
          name: verifiq-api
          envVarKey: DATABASE_URL
      - key: RESEND_API_KEY
        fromService:
          type: web
          name: verifiq-api
          envVarKey: RESEND_API_KEY
      - key: EMAIL_FROM
        fromService:
          type: web
          name: verifiq-api
          envVarKey: EMAIL_FROM
      - key: R2_ACCOUNT_ID
        fromService:
          type: web
          name: verifiq-api
          envVarKey: R2_ACCOUNT_ID
      - key: R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: verifiq-api
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: verifiq-api
          envVarKey: R2_SECRET_ACCESS_KEY
      - key: R2_BUCKET
        fromService:
          type: web
          name: verifiq-api
          envVarKey: R2_BUCKET
      - key: VERIFACTI_API_KEY
        fromService:
          type: web
          name: verifiq-api
          envVarKey: VERIFACTI_API_KEY
      - key: VERIFACTI_ENVIRONMENT
        fromService:
          type: web
          name: verifiq-api
          envVarKey: VERIFACTI_ENVIRONMENT
      - key: CONNECTOR_MASTER_KEY
        fromService:
          type: web
          name: verifiq-api
          envVarKey: CONNECTOR_MASTER_KEY
      - key: OPERATOR_EMAIL
        fromService:
          type: web
          name: verifiq-api
          envVarKey: OPERATOR_EMAIL
