# Render Blueprint: staging (branch `stage`). Same commands as the README deploy table.
# Secrets are set in the Render dashboard (sync: false), never in the repo.
services:
  - type: web
    name: verifiq-api-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: stage
    buildCommand: pnpm install --frozen-lockfile && pnpm build:api
    # Migrates on start: if it fails, the new version never passes the health check
    # and Render keeps the previous one live. Fine with a single instance.
    startCommand: pnpm start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: VERIFACTI_API_KEY
        sync: false
      - key: VERIFACTI_ENVIRONMENT
        value: test
      - key: CONNECTOR_MASTER_KEY
        sync: false
      - key: VERIFACTI_WEBHOOK_SECRET
        sync: false
      - key: OPERATOR_EMAIL
        sync: false
  # Sends the outbox to VeriFactu, draws the PDFs and polls the AEAT's verdicts. Render has no free
  # workers: 0.5c-512mb is the cheapest plan. Its secrets are the API's (fromService), so they are set
  # once, on the API; after changing one there, redeploy the worker too.
  - type: worker
    name: verifiq-worker-staging
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    branch: stage
    buildCommand: pnpm install --frozen-lockfile && pnpm build:api
    startCommand: pnpm start:worker
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: DATABASE_URL
      - key: RESEND_API_KEY
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: RESEND_API_KEY
      - key: EMAIL_FROM
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: EMAIL_FROM
      - key: R2_ACCOUNT_ID
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: R2_ACCOUNT_ID
      - key: R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: R2_SECRET_ACCESS_KEY
      - key: R2_BUCKET
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: R2_BUCKET
      - key: VERIFACTI_API_KEY
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: VERIFACTI_API_KEY
      - key: VERIFACTI_ENVIRONMENT
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: VERIFACTI_ENVIRONMENT
      - key: CONNECTOR_MASTER_KEY
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: CONNECTOR_MASTER_KEY
      - key: OPERATOR_EMAIL
        fromService:
          type: web
          name: verifiq-api-staging
          envVarKey: OPERATOR_EMAIL
