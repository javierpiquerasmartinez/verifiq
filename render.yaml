# Render Blueprint: staging (branch `stage`). Same commands as the README deploy table.
# Secrets are set in the Render dashboard (sync: false), never in the repo.
services:
  - type: web
    name: verifiq-api-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: stage
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@verifiq/api
    # Migrates on start: if it fails, the new version never passes the health check
    # and Render keeps the previous one live. Fine with a single instance.
    startCommand: node apps/api/dist/run-migrations.js && node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
  # Worker (`node apps/api/dist/worker.js`): added when it has work (Emisión). Render has no free workers.
