# Render Blueprint: staging (branch `stage`). Same commands as the README deploy table.
# Secrets are set in the Render dashboard (sync: false), never in the repo.
services:
  - type: web
    name: verifiq-api-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: stage
    buildCommand: pnpm install --frozen-lockfile && pnpm build:api
    # Migrates on start: if it fails, the new version never passes the health check
    # and Render keeps the previous one live. Fine with a single instance.
    startCommand: pnpm start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
  # Worker (`pnpm start:worker`): added when it has work (invoice issuance). Render has no free workers.
